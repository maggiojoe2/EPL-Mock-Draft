name: PR Preview Cleanup

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

env:
  CLOUDFLARE_PAGES_PROJECT: epl-mock-drafter

jobs:
  delete-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Delete this PR's preview deployment(s)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          deployments=$(npx wrangler pages deployment list \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" --json)

          ids=$(printf '%s' "$deployments" | jq -r --arg branch "$BRANCH" \
            '(.result // .)[] | select(.deployment_trigger.metadata.branch == $branch) | .id')

          if [ -z "$ids" ]; then
            echo "No preview deployments found for branch '$BRANCH' — nothing to clean up."
            exit 0
          fi

          for id in $ids; do
            echo "Deleting deployment $id (branch: $BRANCH)"
            npx wrangler pages deployment delete "$id" \
              --project-name="$CLOUDFLARE_PAGES_PROJECT" --force
          done
